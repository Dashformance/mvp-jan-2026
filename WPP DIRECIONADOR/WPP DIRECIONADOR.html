<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Redirect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --wa-green: #25D366;
            --wa-dark-green: #128C7E;
            --wa-light: #DCF8C6;
            --bg-color: #f0f2f5;
            --text-color: #111b21;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid var(--wa-green);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        p {
            font-size: 14px;
            color: #667781;
            margin-bottom: 24px;
        }

        /* Input Styles */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #3b4a54;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            border: 2px solid #e9edef;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            font-family: inherit;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: var(--wa-green);
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.2);
        }

        button.action-btn {
            background-color: var(--wa-green);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        button.action-btn:hover {
            background-color: var(--wa-dark-green);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(18, 140, 126, 0.4);
        }

        button.action-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #ea0038;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .preview-box {
            background-color: #f7f8fa;
            border: 1px solid #e9edef;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            color: #667781;
            margin-top: 10px;
            display: none;
            word-wrap: break-word;
        }

        .counter-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .counter-box {
            background-color: var(--wa-light);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--wa-dark-green);
            border: 1px solid #b7e4c7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .counter-box strong {
            color: var(--wa-green);
            font-size: 18px;
        }

        /* Contacts List Styles */
        .contacts-section {
            margin-top: 30px;
            text-align: left;
            border-top: 1px solid #e9edef;
            padding-top: 20px;
        }

        .contacts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .contacts-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
            margin: 0;
        }

        .contacts-date {
            font-size: 13px;
            color: #667781;
            font-weight: 500;
        }

        .contacts-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e9edef;
            border-radius: 8px;
            background: #fff;
        }

        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #e9edef;
            font-size: 13px;
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .contact-name {
            font-weight: 600;
            color: var(--text-color);
        }

        .contact-phone {
            color: #667781;
        }

        .contact-time {
            font-size: 11px;
            color: #99aab5;
        }

        .remove-btn {
            background-color: #fce8e8;
            color: #ea0038;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .remove-btn:hover {
            background-color: #fad1d1;
        }

        .export-btn {
            background-color: #fff;
            color: var(--wa-dark-green);
            border: 2px solid var(--wa-dark-green);
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            margin-top: 16px;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .export-btn:hover {
            background-color: var(--wa-dark-green);
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="counter-container">
            <div class="counter-box">
                Contatados: <strong id="contactCounter">0</strong>
            </div>
        </div>
        <img src="Generated Image March 09, 2026 - 7_57PM.png" alt="Foto da Profissional" class="profile-pic">
        <h1>Iniciar Conversa</h1>
        <p>Cole os dados do cliente para gerar a mensagem.</p>

        <div>
            <div class="input-group">
                <label for="smartData">Dados do cliente e da construtora</label>
                <textarea id="smartData" placeholder="Ex:&#10;Construtora Tenda&#10;(11) 98888-7777"
                    oninput="previewMensagemInteligente()"></textarea>
                <div class="error-msg" id="smartErrorMsg">Não foi possível encontrar um número válido no texto.</div>

                <div id="mensagemPreview" class="preview-box">
                    <strong>Mensagem que será enviada:</strong><br>
                    <span id="previewText">...</span>
                </div>
            </div>
            <button class="action-btn" onclick="redirectToWhatsAppSmart()">Enviar Mensagem Padrão</button>

            <div class="contacts-section">
                <div class="contacts-header">
                    <h2>Contatos Salvos</h2>
                    <span class="contacts-date" id="currentDate"></span>
                </div>
                <ul class="contacts-list" id="contactsList">
                    <!-- Items vão aqui -->
                </ul>
                <button class="export-btn" onclick="exportToCSV()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Exportar Planilha (CSV)
                </button>
            </div>
        </div>
    </div>

    <script>
        function formatNumber(rawNumber) {
            let number = rawNumber.replace(/\D/g, '');
            if (number.length === 10 || number.length === 11) {
                number = '55' + number;
            }
            return number;
        }

        function extractSmartData(text) {
            let phone = "";
            let companyName = "sua construtora";

            const phoneRegex = /(?:\+?55\s*)?(?:\(?\d{2}\)?\s*)?\d{4,5}[-\s]?\d{4}/;
            const fallbackRegex = /\d[ \d\-\(\)]{8,}\d/;

            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let phoneLineIndex = -1;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const phoneMatch = line.match(phoneRegex);
                if (phoneMatch) {
                    phone = formatNumber(phoneMatch[0]);
                    phoneLineIndex = i;
                    break;
                }
                const fallbackMatch = line.match(fallbackRegex);
                if (fallbackMatch) {
                    phone = formatNumber(fallbackMatch[0]);
                    phoneLineIndex = i;
                    break;
                }
            }

            if (lines.length > 0) {
                if (lines.length === 1) {
                    let textWithoutPhone = lines[0].replace(phoneRegex, '').replace(fallbackRegex, '').trim();
                    // Remove special characters like - or : at the edge
                    textWithoutPhone = textWithoutPhone.replace(/^[:\-\s]+|[:\-\s]+$/g, '');
                    if (textWithoutPhone.length > 0) {
                        companyName = textWithoutPhone;
                    }
                } else {
                    for (let i = 0; i < lines.length; i++) {
                        if (i !== phoneLineIndex) {
                            companyName = lines[i];
                            break;
                        }
                    }
                }

                // Remove qualquer dado copiado de planilhas após o nome (separa por tab ou duplos/múltiplos espaços)
                companyName = companyName.split('\t')[0].split('  ')[0].trim();
                // Remove prefixos como "Construtora", "Empresa", etc.
                companyName = companyName.replace(/^(construtora|empresa|empreendimento|nome)[:\-\s]+/i, '').trim();
            }

            return { phone, companyName };
        }

        function previewMensagemInteligente() {
            const text = document.getElementById('smartData').value;
            const previewBox = document.getElementById('mensagemPreview');
            const previewText = document.getElementById('previewText');

            if (text.trim().length === 0) {
                previewBox.style.display = 'none';
                return;
            }

            const { companyName, phone } = extractSmartData(text);
            const msg = `Opa... tudo bem? é do comercial da ${companyName}?`;

            previewText.innerText = msg;
            previewBox.style.display = 'block';
        }

        function redirectToWhatsAppSmart() {
            const text = document.getElementById('smartData').value;
            const errorMsg = document.getElementById('smartErrorMsg');
            const textarea = document.getElementById('smartData');

            const { phone, companyName } = extractSmartData(text);

            if (!phone || phone.length < 10) {
                errorMsg.style.display = 'block';
                textarea.style.borderColor = '#ea0038';
                return;
            }

            errorMsg.style.display = 'none';
            textarea.style.borderColor = '#e9edef';

            const msg = `Opa... tudo bem? é do comercial da ${companyName}?`;
            const encodedMsg = encodeURIComponent(msg);

            const url = `https://api.whatsapp.com/send/?phone=${phone}&text=${encodedMsg}&type=phone_number&app_absent=0`;
            window.open(url, '_blank');

            // Salva o contato
            let contacts = JSON.parse(localStorage.getItem('wapp_contacts') || '[]');
            const now = new Date();

            contacts.push({
                id: Date.now(),
                name: companyName,
                phone: phone,
                date: now.toLocaleDateString(),
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            localStorage.setItem('wapp_contacts', JSON.stringify(contacts));

            renderContacts();
        }

        function renderContacts() {
            let contacts = JSON.parse(localStorage.getItem('wapp_contacts') || '[]');
            const listEl = document.getElementById('contactsList');
            listEl.innerHTML = '';

            const todayStr = new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('currentDate').innerText = todayStr.charAt(0).toUpperCase() + todayStr.slice(1);

            // Reverte para mostrar os mais novos no topo
            [...contacts].reverse().forEach(contact => {
                const li = document.createElement('li');
                li.className = 'contact-item';
                li.innerHTML = `
                    <div class="contact-info">
                        <span class="contact-name">${contact.name}</span>
                        <span class="contact-phone">${contact.phone}</span>
                        <span class="contact-time">${contact.date} às ${contact.time}</span>
                    </div>
                    <button class="remove-btn" onclick="removeContact(${contact.id})" title="Remover contato">X</button>
                `;
                listEl.appendChild(li);
            });

            // Atualiza o contador de topo
            document.getElementById('contactCounter').innerText = contacts.length;
        }

        function removeContact(id) {
            let contacts = JSON.parse(localStorage.getItem('wapp_contacts') || '[]');
            contacts = contacts.filter(c => c.id !== id);
            localStorage.setItem('wapp_contacts', JSON.stringify(contacts));
            renderContacts();
        }

        function exportToCSV() {
            let contacts = JSON.parse(localStorage.getItem('wapp_contacts') || '[]');
            if (contacts.length === 0) {
                alert("Não há contatos para exportar.");
                return;
            }

            // Adiciona BOM para caracteres especiais abrirem corretamente no Excel do Windows
            let csvContent = "\uFEFFNome;Telefone;Data;Hora\n";
            contacts.forEach(c => {
                csvContent += `"${c.name}";"${c.phone}";"${c.date}";"${c.time}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `contatados_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = function () {
            // Migrar o contador antigo caso exista
            let oldCounter = localStorage.getItem('wapp_contact_count');
            if (oldCounter) {
                // remove o velho para não conflitar
                localStorage.removeItem('wapp_contact_count');
            }
            renderContacts();
        };
    </script>
</body>

</html>
